name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Sin hooks de git en el release: los `git commit`/`git push` del changesets/action no deben
  # disparar el pre-push (que corre la suite y necesita Chromium que aquí no se instala).
  # Lo respetan tanto el postinstall de la dependencia simple-git-hooks como el nuestro.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    name: version / publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets necesita el historial completo para calcular el diff contra baseBranch.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bunx turbo run check-publish --filter='@callepuzzle/*'

      # Con changesets pendientes: abre/actualiza el PR "chore: version packages".
      # Sin changesets pendientes (es decir, al mergear ese PR): publica en GitHub Packages.
      # v2: la CLI v3 cambió el formato de salida del publish y la v1 no la entiende —
      # publicaba, pero sin crear tags ni GitHub Releases. v2 lee la salida por NDJSON.
      - uses: changesets/action@v2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
