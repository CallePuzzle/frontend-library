name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: el CI no escribe en el repo ni publica. Sin este bloque, el token hereda los
# permisos por defecto del repositorio, que pueden ser de escritura.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # `prisma generate` del demo exige que DATABASE_URL exista aunque el build no toque la BD.
  DATABASE_URL: file:./dev.db

jobs:
  quality:
    name: lint + check-types + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # El token no se queda en .git/config al alcance de dependencias y herramientas.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Caché local de turbo: evita repetir builds entre pushes de la misma rama.
      - name: Restaurar caché de turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      # Los proyectos `component` y `storybook` de vitest corren en navegador real.
      - name: Instalar Chromium para vitest browser mode
        run: bunx playwright install --with-deps chromium

      # Formato: el .prettierrc del root es la única fuente de verdad (ver plan 11, T11.1).
      - name: Formato
        run: bun run format:ci

      - name: lint / check-types / test / build
        run: bunx turbo run lint check-types test build

  packages:
    name: check-publish (publint + attw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # El token no se queda en .git/config al alcance de dependencias y herramientas.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Restaurar caché de turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      # Compila los paquetes publicables y valida el empaquetado con publint + attw.
      # El scope se limita a @callepuzzle/*: el demo no debe poder tumbar el CI de la librería.
      - run: bunx turbo run check-publish --filter='@callepuzzle/*'

  storybook:
    name: build-storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # El token no se queda en .git/config al alcance de dependencias y herramientas.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Restaurar caché de turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      - run: bunx turbo run build-storybook --filter=@callepuzzle/svelte-ui

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7
